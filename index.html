<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Addition Game</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background: #f0f8ff;
    }

    /* HOME PAGE */
    .home-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #6c5ce7, #a29bfe, #74b9ff, #0984e3);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .game-title {
      font-size: 52px;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .game-title span { color: #feca57; }

    .game-subtitle {
      color: #ffffff;
      font-size: 18px;
      margin: 10px 0 30px;
    }

    .play-button {
      border: none;
      border-radius: 50px;
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      color: white;
      font-size: 26px;
      font-weight: 900;
      padding: 16px 45px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b22222, 0 15px 25px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .play-icon {
      width: 40px;
      height: 40px;
      background: white;
      color: #ee5253;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .play-button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b22222;
    }

    /* ADDITION MENU PAGE */
    .addition-menu-page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      background: linear-gradient(to bottom, #7ed6df, #e056fd, #ffbe76);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .banner-title {
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      color: white;
      padding: 10px 45px;
      border-radius: 25px;
      font-size: 28px;
      font-weight: 900;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      margin: 15px 0 25px;
    }

    .addition-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 720px;
      width: 100%;
    }

    @media (max-width: 650px) {
      .addition-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .add-card {
      background: #ff7675;
      border: 4px solid #d63031;
      border-radius: 20px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      transition: transform 0.15s;
    }

    .add-card:active { transform: scale(0.95); }

    .add-card-inner {
      background: #006266;
      border-radius: 14px;
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
    }

    .add-card-label {
      color: white;
      font-weight: bold;
      font-size: 13px;
      margin-top: 6px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    /* QUIZ PAGE */
    .quiz-page {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #273c75;
    }

    .quiz-header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .score-display {
      font-size: 18px;
      font-weight: bold;
      color: #2d3436;
      background: #feca57;
      padding: 8px 18px;
      border-radius: 20px;
    }

    .chalkboard-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: #104e33;
      border: 10px solid #8c7ae6;
      border-radius: 24px;
      padding: 30px 15px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .equation-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 42px;
      color: white;
      font-weight: bold;
      width: 100%;
    }

    .num-1 { color: #ff9f43; }
    .num-2 { color: #54a0ff; }

    .target-box {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px dashed white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #feca57;
    }

    .visual-split-container {
      display: flex;
      width: 100%;
      height: 140px;
      margin-top: 15px;
      border-top: 2px solid rgba(255, 255, 255, 0.3);
    }

    .visual-box {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      font-size: 38px;
    }

    .visual-box.left {
      border-right: 2px solid rgba(255, 255, 255, 0.3);
    }

    .count-items-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 38px;
      max-width: 420px;
    }

    .options-grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .option-btn {
      width: 75px;
      height: 75px;
      font-size: 34px;
      font-weight: bold;
      border: none;
      border-radius: 18px;
      background: #ff4757;
      color: white;
      box-shadow: 0 6px 0 #c0392b, 0 10px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .option-btn:nth-child(2) { background: #2ed573; box-shadow: 0 6px 0 #26af5f; }
    .option-btn:nth-child(3) { background: #1e90ff; box-shadow: 0 6px 0 #0f68c9; }
    .option-btn:nth-child(4) { background: #ffa502; box-shadow: 0 6px 0 #d35400; }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #888;
    }

    .popup-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(to right, #4834d4, #686de0);
      border: 4px solid #ffffff;
      border-radius: 30px;
      padding: 15px 35px;
      color: white;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-banner.show { transform: translate(-50%, -50%) scale(1); }

    .home-button {
      padding: 8px 16px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      font-weight: bold;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HOME PAGE -->
  <div id="homePage" class="home-page">
    <div class="hero-content">
      <div class="brand-badge">🎮 FUN LEARNING</div>
      <h1 class="game-title">Addition <span>Fun</span></h1>
      <p class="game-subtitle">Learn Addition & Have Fun! 🎉</p>

      <button class="play-button" onclick="playGame()">
        <span class="play-icon">▶</span>
        <span>PLAY NOW</span>
      </button>
    </div>
  </div>

  <!-- ADDITION MENU PAGE -->
  <div id="additionMenu" class="addition-menu-page hidden">
    <div style="width: 100%; max-width: 720px; display: flex; justify-content: start;">
      <button class="home-button" onclick="goHome()">🏠 Home</button>
    </div>

    <div class="banner-title">Addition Modes</div>

    <div class="addition-grid">
      <div class="add-card" onclick="startQuiz('count')">
        <div class="add-card-inner">🦒🧁🚗 ➔ [ ? ]</div>
        <div class="add-card-label">Counting</div>
      </div>

      <div class="add-card" onclick="startQuiz('+')">
        <div class="add-card-inner">🌂🌂 + 🌂<br>= 3</div>
        <div class="add-card-label">Adding Fun</div>
      </div>

      <div class="add-card" onclick="startQuiz('2digit')">
        <div class="add-card-inner">22 + 12 = 34</div>
        <div class="add-card-label">2 Digits +</div>
      </div>

      <div class="add-card" onclick="startQuiz('easy')">
        <div class="add-card-inner">2 + 5 = 7<br>10 + 6 = 16</div>
        <div class="add-card-label">Easy Addition</div>
      </div>
    </div>
  </div>

  <!-- QUIZ / COUNTING PAGE -->
  <div id="quizPage" class="quiz-page hidden">
    <div class="quiz-header">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
      <div id="scoreDisplay" class="score-display">⭐ Score: 0</div>
    </div>

    <div class="chalkboard-card">
      <!-- EQUATION DISPLAY -->
      <div id="equationRow" class="equation-top-row">
        <span id="num1Text" class="num-1">1</span>
        <span>+</span>
        <span id="num2Text" class="num-2">2</span>
        <span>=</span>
        <div id="targetBox" class="target-box">?</div>
      </div>

      <!-- COUNTING MODE DISPLAY -->
      <div id="countItemsContainer" class="count-items-container hidden"></div>

      <!-- VISUAL ADDITION BOXES -->
      <div id="visualSplitContainer" class="visual-split-container">
        <div id="leftVisualBox" class="visual-box left"></div>
        <div id="rightVisualBox" class="visual-box"></div>
      </div>
    </div>

    <div id="optionsContainer" class="options-grid"></div>
  </div>

  <!-- SUCCESS POPUP BANNER -->
  <div id="popupBanner" class="popup-banner">
    <span id="popupText">Great Job!</span> 🎉
  </div>

  <script>
    let currentOp = '+';
    let currentAnswer = 2;
    let score = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAudioTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrectSound() {
      playAudioTone(523.25, 'triangle', 0.15);
      setTimeout(() => playAudioTone(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playAudioTone(783.99, 'triangle', 0.25), 200);
    }

    function playWrongSound() {
      playAudioTone(220, 'sawtooth', 0.2);
      setTimeout(() => playAudioTone(180, 'sawtooth', 0.3), 150);
    }

    function playGame() {
      document.getElementById("homePage").classList.add("hidden");
      document.getElementById("additionMenu").classList.remove("hidden");
    }

    function goHome() {
      document.getElementById("additionMenu").classList.add("hidden");
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("homePage").classList.remove("hidden");
    }

    function goMenu() {
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("additionMenu").classList.remove("hidden");
    }

    function startQuiz(op) {
      currentOp = op;
      score = 0;
      document.getElementById("scoreDisplay").innerText = "⭐ Score: " + score;
      document.getElementById("additionMenu").classList.add("hidden");
      document.getElementById("quizPage").classList.remove("hidden");
      generateQuestion();
    }

    function generateQuestion() {
      document.getElementById("targetBox").innerText = "?";
      document.getElementById("countItemsContainer").innerHTML = "";
      document.getElementById("leftVisualBox").innerHTML = "";
      document.getElementById("rightVisualBox").innerHTML = "";

      const visualItems = ['👟', '🌂', '🚗', '🍎', '🧁', '🎈', '🦆', '🍬'];

      if (currentOp === 'count') {
        document.getElementById("equationRow").classList.add("hidden");
        document.getElementById("visualSplitContainer").classList.add("hidden");
        document.getElementById("countItemsContainer").classList.remove("hidden");

        let count = Math.floor(Math.random() * 10) + 1;
        currentAnswer = count;
        let icon = visualItems[Math.floor(Math.random() * visualItems.length)];

        let displayHTML = '';
        for (let i = 0; i < count; i++) {
          displayHTML += icon + ' ';
        }
        document.getElementById("countItemsContainer").innerHTML = displayHTML;
      } 
      else if (currentOp === '+') {
        document.getElementById("equationRow").classList.remove("hidden");
        document.getElementById("visualSplitContainer").classList.remove("hidden");
        document.getElementById("countItemsContainer").classList.add("hidden");

        let num1 = Math.floor(Math.random() * 5) + 1;
        let num2 = Math.floor(Math.random() * 5) + 1;
        currentAnswer = num1 + num2;

        document.getElementById("num1Text").innerText = num1;
        document.getElementById("num2Text").innerText = num2;

        let icon = visualItems[Math.floor(Math.random() * visualItems.length)];

        for (let i = 0; i < num1; i++) document.getElementById("leftVisualBox").innerHTML += icon;
        for (let i = 0; i < num2; i++) document.getElementById("rightVisualBox").innerHTML += icon;
      } 
      else if (currentOp === '2digit') {
        document.getElementById("equationRow").classList.remove("hidden");
        document.getElementById("visualSplitContainer").classList.add("hidden");
        document.getElementById("countItemsContainer").classList.add("hidden");

        let num1 = Math.floor(Math.random() * 40) + 10;
        let num2 = Math.floor(Math.random() * 40) + 10;
        currentAnswer = num1 + num2;

        document.getElementById("num1Text").innerText = num1;
        document.getElementById("num2Text").innerText = num2;
      }
      else if (currentOp === 'easy') {
        document.getElementById("equationRow").classList.remove("hidden");
        document.getElementById("visualSplitContainer").classList.add("hidden");
        document.getElementById("countItemsContainer").classList.add("hidden");

        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        currentAnswer = num1 + num2;

        document.getElementById("num1Text").innerText = num1;
        document.getElementById("num2Text").innerText = num2;
      }

      let options = [currentAnswer];
      while (options.length < 3) {
        let wrong = currentAnswer + (Math.floor(Math.random() * 7) - 3);
        if (wrong >= 1 && !options.includes(wrong)) {
          options.push(wrong);
        }
      }
      options.sort(() => Math.random() - 0.5);

      let container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      options.forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, buttonEl) {
      if (selected == currentAnswer) {
        playCorrectSound();
        score += 10;
        document.getElementById("scoreDisplay").innerText = "⭐ Score: " + score;
        document.getElementById("targetBox").innerText = currentAnswer;

        let banner = document.getElementById("popupBanner");
        document.getElementById("popupText").innerText = `Correct! ${currentAnswer}`;
        banner.classList.add("show");
        setTimeout(() => banner.classList.remove("show"), 1400);

        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });

        setTimeout(() => {
          generateQuestion();
        }, 1200);
      } else {
        playWrongSound();
        buttonEl.style.background = "#d63031";
      }
    }
  </script>
</body>
</html>
