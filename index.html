<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Maths</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ANIMATED HERO HOME PAGE -->
  <div id="homePage" class="home-page">
    <div class="floating-shapes">
      <span class="shape s1">➕</span>
      <span class="shape s2">➖</span>
      <span class="shape s3">✖️</span>
      <span class="shape s4">➗</span>
      <span class="shape s5">1️⃣</span>
      <span class="shape s6">2️⃣</span>
      <span class="shape s7">3️⃣</span>
    </div>

    <div class="hero-content">
      <div class="brand-badge">🎮 FUN LEARNING</div>
      <h1 class="game-title">Kids <span>Maths</span></h1>
      <p class="game-subtitle">Learn Maths & Have Fun! 🎉</p>

      <button class="play-button" onclick="playGame()">
        <span class="play-icon">▶</span>
        <span>PLAY NOW</span>
      </button>
    </div>
  </div>

  <!-- MAIN MENU PAGE -->
  <div id="menuPage" class="menu-page hidden">
    <button class="home-button" onclick="goHome()">🏠 Home</button>
    <h1 class="menu-title">🧮 Choose a Mode</h1>

    <div class="menu-grid">
      <button class="card-btn add" onclick="startQuiz('+')">
        <span class="icon">➕</span>
        <span>Addition</span>
      </button>
      <button class="card-btn sub" onclick="startQuiz('-')">
        <span class="icon">➖</span>
        <span>Subtraction</span>
      </button>
      <button class="card-btn mul" onclick="startQuiz('*')">
        <span class="icon">✖️</span>
        <span>Multiplication</span>
      </button>
      <button class="card-btn div" onclick="startQuiz('/')">
        <span class="icon">➗</span>
        <span>Division</span>
      </button>
    </div>
  </div>

  <!-- QUIZ GAME PAGE -->
  <div id="quizPage" class="quiz-page hidden">
    <div class="quiz-header">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
      <div id="scoreDisplay" class="score-display">⭐ Score: 0</div>
    </div>

    <div class="question-card">
      <span class="quiz-badge">Solve This!</span>
      <h2 id="questionText">5 + 3 = ?</h2>
    </div>

    <div id="optionsContainer" class="options-grid">
      <!-- Options JS se generate honge -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
