<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky, Grass & Root Letters</title>
  
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    .learning-container {
      max-width: 900px;
      margin: 30px auto;
      text-align: center;
      padding: 20px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 28px;
    }

    /* Category Buttons */
    .category-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category-buttons button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 25px;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-sky { background-color: #0288d1; }
    .btn-grass { background-color: #2e7d32; }
    .btn-root { background-color: #d84315; }
    .btn-all { background-color: #6a1b9a; }

    .category-buttons button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    /* Letters Grid */
    .letters-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }

    /* 4-Lines Notebook Card Style */
    .letter-card {
      width: 110px;
      height: 150px;
      border: 2px solid #555;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(
        to bottom,
        #e0f7fa 0%, #e0f7fa 25%,     /* Sky area */
        #e8f5e9 25%, #e8f5e9 75%,     /* Grass area */
        #efebe9 75%, #efebe9 100%     /* Root area */
      );
      box-shadow: 0 5px 12px rgba(0,0,0,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .letter-card:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    /* Notebook Lines Effect */
    .letter-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        transparent,
        transparent 36px,
        #ff5252 37px,  /* Sky line (Red) */
        transparent 38px,
        transparent 73px,
        #2196f3 74px,  /* Middle line 1 (Blue) */
        transparent 75px,
        transparent 110px,
        #2196f3 111px, /* Middle line 2 (Blue) */
        transparent 112px,
        transparent 147px,
        #ff5252 148px  /* Root line (Red) */
      );
      opacity: 0.5;
    }

    .letter-text {
      font-size: 80px;
      font-weight: bold;
      line-height: 130px;
      position: relative;
      z-index: 2;
      display: block;
    }

    /* Text Color per Category */
    .sky-bg { color: #0288d1; }
    .grass-bg { color: #2e7d32; }
    .root-bg { color: #d84315; }

    /* Pop/Write Animation */
    @keyframes writeAnim {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      60% { opacity: 1; transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .animate-letter {
      animation: writeAnim 0.5s ease-out;
    }
  </style>
</head>
<body>

  <div class="learning-container">
    <h2>Sky, Grass & Root Letters</h2>
    
    <div class="category-buttons">
      <button class="btn-sky" onclick="filterLetters('sky')">Sky Letters (7)</button>
      <button class="btn-grass" onclick="filterLetters('grass')">Grass Letters (14)</button>
      <button class="btn-root" onclick="filterLetters('root')">Root Letters (5)</button>
      <button class="btn-all" onclick="filterLetters('all')">All Letters (26)</button>
    </div>

    <div id="lettersGrid" class="letters-grid"></div>
  </div>

  <script>
    // Alphabet Categories Setup
    const lettersData = [
      // Sky Letters (b, d, f, h, k, l, t)
      { char: 'b', type: 'sky' }, { char: 'd', type: 'sky' }, { char: 'f', type: 'sky' },
      { char: 'h', type: 'sky' }, { char: 'k', type: 'sky' }, { char: 'l', type: 'sky' }, { char: 't', type: 'sky' },

      // Grass Letters (a, c, e, i, m, n, o, r, s, u, v, w, x, z)
      { char: 'a', type: 'grass' }, { char: 'c', type: 'grass' }, { char: 'e', type: 'grass' },
      { char: 'i', type: 'grass' }, { char: 'm', type: 'grass' }, { char: 'n', type: 'grass' },
      { char: 'o', type: 'grass' }, { char: 'r', type: 'grass' }, { char: 's', type: 'grass' },
      { char: 'u', type: 'grass' }, { char: 'v', type: 'grass' }, { char: 'w', type: 'grass' },
      { char: 'x', type: 'grass' }, { char: 'z', type: 'grass' },

      // Root Letters (g, j, p, q, y)
      { char: 'g', type: 'root' }, { char: 'j', type: 'root' }, { char: 'p', type: 'root' },
      { char: 'q', type: 'root' }, { char: 'y', type: 'root' }
    ];

    // Render Cards
    function renderLetters(filter = 'all') {
      const container = document.getElementById('lettersGrid');
      container.innerHTML = '';

      const filtered = filter === 'all' 
        ? lettersData 
        : lettersData.filter(item => item.type === filter);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'letter-card';
        
        const textSpan = document.createElement('span');
        textSpan.className = `letter-text ${item.type}-bg`;
        textSpan.innerText = item.char;

        card.appendChild(textSpan);

        // Click Event for Animation & Voice Sound
        card.onclick = () => playSoundAndAnimate(item.char, item.type, textSpan);

        container.appendChild(card);
      });
    }

    // Play Sound & Trigger Animation
    function playSoundAndAnimate(char, type, element) {
      // Re-trigger CSS animation
      element.classList.remove('animate-letter');
      void element.offsetWidth; // Force Reflow
      element.classList.add('animate-letter');

      // Cancel any ongoing speech
      window.speechSynthesis.cancel();

      // Clear English Audio Voice
      const speech = new SpeechSynthesisUtterance();
      speech.text = `${char}. ${char} is a ${type} letter.`;
      speech.lang = 'en-US';
      speech.rate = 0.8; // Slow speech rate for kids
      
      window.speechSynthesis.speak(speech);
    }

    // Filter Function
    function filterLetters(category) {
      renderLetters(category);
    }

    // Initialize on page load
    renderLetters('all');
  </script>

</body>
</html>
