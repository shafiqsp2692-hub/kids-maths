<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Kids Maths</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FIRST PAGE -->

  <div id="homePage" class="home-page">

    <button class="play-button"
            onclick="playGame()">

      <span class="play-icon">▶</span>
      <span>PLAY</span>

    </button>

  </div>


  <!-- MAIN MENU -->

  <div id="menuPage" class="menu-page hidden">

    <button class="home-button"
            onclick="goHome()">
      🏠 Home
    </button>

    <h1>🧮 Kids Maths</h1>

    <p>Choose a Maths Game 🎯</p>

    <button onclick="startQuiz('+')">
      ➕ Addition
    </button>

    <button onclick="startQuiz('-')">
      ➖ Subtraction
    </button>

    <button onclick="startQuiz('*')">
      ✖️ Multiplication
    </button>

    <button onclick="startQuiz('/')">
      ➗ Division
    </button>

  </div>


  <script src="script.js"></script>

</body>

</html>
