<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Maths - Ultimate Edition</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-gradient: linear-gradient(-45deg, #6c5ce7, #a29bfe, #74b9ff, #0984e3);
      --page-bg: #edf2f7;
      --card-bg: #ffffff;
      --text-color: #2d3436;
    }

    body.theme-neon {
      --bg-gradient: linear-gradient(-45deg, #fd79a8, #e84393, #6c5ce7, #a29bfe);
      --page-bg: #2d3436;
      --card-bg: #636e72;
      --text-color: #ffffff;
    }

    body.theme-mint {
      --bg-gradient: linear-gradient(-45deg, #00b894, #55efc4, #81ecec, #00cec9);
      --page-bg: #e6faf5;
      --card-bg: #ffffff;
      --text-color: #2d3436;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background: var(--page-bg);
      color: var(--text-color);
      transition: all 0.3s ease;
    }

    /* HOME PAGE */
    .home-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .game-title {
      font-size: 52px;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .game-title span { color: #feca57; }

    .game-subtitle {
      color: #ffffff;
      font-size: 18px;
      margin: 10px 0 30px;
    }

    .play-button {
      border: none;
      border-radius: 50px;
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      color: white;
      font-size: 26px;
      font-weight: 900;
      padding: 16px 45px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b22222, 0 15px 25px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .play-icon {
      width: 40px;
      height: 40px;
      background: white;
      color: #ee5253;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .play-button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b22222;
    }

    /* MENU PAGE */
    .menu-page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      text-align: center;
    }

    .menu-title {
      font-size: 28px;
      margin: 15px 0 25px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card-btn {
      border: none;
      border-radius: 20px;
      padding: 20px 10px;
      background: var(--card-bg);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      transition: transform 0.15s ease;
    }

    .card-btn:active {
      transform: scale(0.94);
    }

    .card-btn .icon {
      font-size: 36px;
    }

    .card-btn span:nth-child(2) {
      font-size: 16px;
      font-weight: bold;
    }

    /* QUIZ PAGE */
    .quiz-page {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-header {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .score-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .score-display {
      font-size: 16px;
      font-weight: bold;
      color: #2d3436;
      background: #feca57;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .streak-badge {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #ff7675;
      padding: 8px 12px;
      border-radius: 20px;
      display: none;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .question-card {
      position: relative;
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      padding: 35px 20px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .question-card h2 {
      font-size: 36px;
      margin: 10px 0;
    }

    .sound-btn {
      border: none;
      background: #e0e8f9;
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 50px;
      cursor: pointer;
      color: #0984e3;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .options-grid {
      width: 100%;
      max-width: 450px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .option-btn {
      padding: 22px 10px;
      font-size: 36px;
      font-weight: bold;
      border: none;
      border-radius: 18px;
      background: var(--card-bg);
      color: #0984e3;
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home-button, .theme-btn {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      font-weight: bold;
    }

    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HOME PAGE -->
  <div id="homePage" class="home-page">
    <div class="hero-content">
      <div class="brand-badge">🎮 FUN LEARNING</div>
      <h1 class="game-title">Kids <span>Maths</span></h1>
      <p class="game-subtitle">Learn Maths & Have Fun! 🎉</p>

      <button class="play-button" onclick="playGame()">
        <span class="play-icon">▶</span>
        <span>PLAY NOW</span>
      </button>
    </div>
  </div>

  <!-- MAIN MENU PAGE -->
  <div id="menuPage" class="menu-page hidden">
    <div class="top-bar">
      <button class="home-button" onclick="goHome()">🏠 Home</button>
      <button class="theme-btn" onclick="toggleTheme()">🎨 Theme</button>
    </div>
    <h1 class="menu-title">🧮 Choose Mode</h1>

    <div class="menu-grid">
      <button class="card-btn" onclick="startQuiz('+')">
        <span class="icon">➕</span>
        <span>Addition</span>
      </button>

      <button class="card-btn" onclick="startQuiz('-')">
        <span class="icon">➖</span>
        <span>Subtraction</span>
      </button>

      <button class="card-btn" onclick="startQuiz('*')">
        <span class="icon">✖️</span>
        <span>Multiplication</span>
      </button>

      <button class="card-btn" onclick="startQuiz('/')">
        <span class="icon">➗</span>
        <span>Division</span>
      </button>

      <button class="card-btn" onclick="startQuiz('count')">
        <span class="icon">🔢</span>
        <span>Counting</span>
      </button>

      <button class="card-btn" onclick="startQuiz('bigsmall')">
        <span class="icon">⚖️</span>
        <span>Big vs Small</span>
      </button>

      <button class="card-btn" onclick="startQuiz('missing')">
        <span class="icon">❓</span>
        <span>Missing Num</span>
      </button>

      <button class="card-btn" onclick="startQuiz('shapes')">
        <span class="icon">📐</span>
        <span>Shapes</span>
      </button>

      <button class="card-btn" onclick="startQuiz('clock')">
        <span class="icon">🕒</span>
        <span>Time / Clock</span>
      </button>

      <button class="card-btn" onclick="startQuiz('pattern')">
        <span class="icon">🎨</span>
        <span>Patterns</span>
      </button>
    </div>
  </div>

  <!-- QUIZ GAME PAGE -->
  <div id="quizPage" class="quiz-page hidden">
    <div class="quiz-header">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
      <div class="score-container">
        <div id="streakBadge" class="streak-badge">🔥 0 Streak</div>
        <div id="scoreDisplay" class="score-display">⭐ Score: 0</div>
      </div>
    </div>

    <div class="question-card">
      <h2 id="questionText">5 + 3 = ?</h2>
      <button class="sound-btn" onclick="speakQuestion()">🔊 Read Question</button>
    </div>

    <div id="optionsContainer" class="options-grid"></div>
  </div>

  <script>
    let currentOp = '+';
    let currentAnswer = '';
    let speechText = '';
    let score = 0;
    let streak = 0;

    const themes = ['', 'theme-neon', 'theme-mint'];
    let currentThemeIdx = 0;

    function toggleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.body.className = themes[currentThemeIdx];
    }

    // Web Audio API Sound Generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAudioTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrectSound() {
      playAudioTone(523.25, 'triangle', 0.15);
      setTimeout(() => playAudioTone(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playAudioTone(783.99, 'triangle', 0.25), 200);
    }

    function playWrongSound() {
      playAudioTone(220, 'sawtooth', 0.2);
      setTimeout(() => playAudioTone(180, 'sawtooth', 0.3), 150);
    }

    function speakQuestion() {
      if ('speechSynthesis' in window && speechText) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(speechText);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function playGame() {
      document.getElementById("homePage").classList.add("hidden");
      document.getElementById("menuPage").classList.remove("hidden");
    }

    function goHome() {
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("homePage").classList.remove("hidden");
    }

    function goMenu() {
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("menuPage").classList.remove("hidden");
    }

    function startQuiz(operation) {
      currentOp = operation;
      score = 0;
      streak = 0;
      updateScoreUI();
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("quizPage").classList.remove("hidden");
      generateQuestion();
    }

    function updateScoreUI() {
      document.getElementById("scoreDisplay").innerText = "⭐ Score: " + score;
      let badge = document.getElementById("streakBadge");
      if (streak >= 3) {
        badge.style.display = "inline-block";
        badge.innerText = `🔥 ${streak} Streak!`;
      } else {
        badge.style.display = "none";
      }
    }

    function generateQuestion() {
      let num1 = Math.floor(Math.random() * 10) + 1;
      let num2 = Math.floor(Math.random() * 10) + 1;
      let options = [];

      if (currentOp === '+') {
        currentAnswer = num1 + num2;
        document.getElementById("questionText").innerText = `${num1} + ${num2} = ?`;
        speechText = `What is ${num1} plus ${num2}?`;
      } else if (currentOp === '-') {
        if (num1 < num2) [num1, num2] = [num2, num1];
        currentAnswer = num1 - num2;
        document.getElementById("questionText").innerText = `${num1} - ${num2} = ?`;
        speechText = `What is ${num1} minus ${num2}?`;
      } else if (currentOp === '*') {
        currentAnswer = num1 * num2;
        document.getElementById("questionText").innerText = `${num1} × ${num2} = ?`;
        speechText = `What is ${num1} multiplied by ${num2}?`;
      } else if (currentOp === '/') {
        currentAnswer = num1;
        document.getElementById("questionText").innerText = `${num1 * num2} ÷ ${num2} = ?`;
        speechText = `What is ${num1 * num2} divided by ${num2}?`;
      } else if (currentOp === 'count') {
        currentAnswer = num1;
        document.getElementById("questionText").innerText = `Count: ${'⭐ '.repeat(num1)}`;
        speechText = `Count the stars`;
      } else if (currentOp === 'bigsmall') {
        currentAnswer = Math.max(num1, num2);
        document.getElementById("questionText").innerText = `Which is bigger? ${num1} or ${num2}`;
        speechText = `Which number is bigger, ${num1} or ${num2}?`;
        options = [num1, num2];
      } else if (currentOp === 'missing') {
        currentAnswer = num1 + 1;
        document.getElementById("questionText").innerText = `${num1}, __, ${num1 + 2}`;
        speechText = `What is the missing number between ${num1} and ${num1 + 2}?`;
      } else if (currentOp === 'shapes') {
        const shapeList = [
          { symbol: '🔴', name: 'Circle' },
          { symbol: '🟦', name: 'Square' },
          { symbol: '🔺', name: 'Triangle' },
          { symbol: '⭐', name: 'Star' }
        ];
        let target = shapeList[Math.floor(Math.random() * shapeList.length)];
        currentAnswer = target.symbol;
        document.getElementById("questionText").innerText = `Find: ${target.name}`;
        speechText = `Find the ${target.name}`;
        options = shapeList.map(s => s.symbol);
      } else if (currentOp === 'clock') {
        currentAnswer = `${num1}:00`;
        document.getElementById("questionText").innerText = `Clock shows ${num1} o'clock = ?`;
        speechText = `Clock shows ${num1} o'clock`;
        options = [`${num1}:00`, `${(num1%12)+1}:00`, `${(num1+2)%12 + 1}:00`, `${(num1+3)%12 + 1}:00`];
      } else if (currentOp === 'pattern') {
        const patternTypes = [
          { seq: ['🔴', '🟦', '🔴', '🟦'], ans: '🔴', opts: ['🔴', '🟦', '⭐', '🔺'], text: 'Circle, Square, Circle, Square. What comes next?' },
          { seq: ['🔺', '⭐', '🔺', '⭐'], ans: '🔺', opts: ['🔺', '⭐', '🔴', '🟦'], text: 'Triangle, Star, Triangle, Star. What comes next?' },
          { seq: ['🍎', '🍌', '🍎', '🍌'], ans: '🍎', opts: ['🍎', '🍌', '🍇', '🍊'], text: 'Apple, Banana, Apple, Banana. What comes next?' },
          { seq: ['2', '4', '6', '8'], ans: '10', opts: ['10', '9', '11', '12'], text: '2, 4, 6, 8. What comes next?' },
          { seq: ['5', '10', '15', '20'], ans: '25', opts: ['25', '22', '30', '24'], text: '5, 10, 15, 20. What comes next?' }
        ];
        let p = patternTypes[Math.floor(Math.random() * patternTypes.length)];
        currentAnswer = p.ans;
        document.getElementById("questionText").innerText = `${p.seq.join(' ')}  ?`;
        speechText = p.text;
        options = p.opts;
      }

      let container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      if (options.length === 0) {
        options = [currentAnswer];
        while (options.length < 4) {
          let wrong = (typeof currentAnswer === 'number') ? currentAnswer + (Math.floor(Math.random() * 7) - 3) : Math.floor(Math.random() * 20);
          if (wrong >= 0 && !options.includes(wrong)) {
            options.push(wrong);
          }
        }
        options.sort(() => Math.random() - 0.5);
      } else {
        options.sort(() => Math.random() - 0.5);
      }

      options.forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        container.appendChild(btn);
      });

      speakQuestion();
    }

    function checkAnswer(selected, buttonEl) {
      if (selected == currentAnswer) {
        playCorrectSound();
        score += 10;
        streak += 1;
        updateScoreUI();
        buttonEl.style.background = "#55efc4";
        confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
      } else {
        playWrongSound();
        streak = 0;
        updateScoreUI();
        buttonEl.style.background = "#ff7675";
        buttonEl.style.color = "white";
      }

      setTimeout(() => {
        generateQuestion();
      }, 500);
    }
  </script>
</body>
</html>
