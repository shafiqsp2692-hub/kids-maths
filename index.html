<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Maths & Coloring</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background: #f0f8ff;
    }

    /* HOME PAGE */
    .home-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(-45deg, #6c5ce7, #a29bfe, #74b9ff, #0984e3);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .game-title {
      font-size: 52px;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .game-title span { color: #feca57; }

    .game-subtitle {
      color: #ffffff;
      font-size: 18px;
      margin: 10px 0 30px;
    }

    .play-button {
      border: none;
      border-radius: 50px;
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      color: white;
      font-size: 26px;
      font-weight: 900;
      padding: 16px 45px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b22222, 0 15px 25px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .play-icon {
      width: 40px;
      height: 40px;
      background: white;
      color: #ee5253;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .play-button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b22222;
    }

    /* MENU PAGE */
    .menu-page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      text-align: center;
      background: #f4f7fe;
    }

    .menu-title {
      font-size: 28px;
      color: #2d3436;
      margin: 15px 0 25px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .card-btn {
      border: none;
      border-radius: 20px;
      padding: 20px 10px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      transition: transform 0.15s ease;
    }

    .card-btn:active { transform: scale(0.94); }
    .card-btn .icon { font-size: 36px; }

    .card-btn span:nth-child(2) {
      font-size: 16px;
      font-weight: bold;
      color: #2d3436;
    }

    /* ADDITION SUB MENU */
    .addition-menu-page {
      min-height: 100vh;
      padding: 15px;
      background: linear-gradient(to bottom, #7ed6df, #e056fd, #ffbe76);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .banner-title {
      background: linear-gradient(to bottom, #ff9f43, #ee5253);
      color: white;
      padding: 10px 45px;
      border-radius: 25px;
      font-size: 28px;
      font-weight: 900;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      margin: 10px 0 20px;
    }

    .addition-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 720px;
      width: 100%;
    }

    @media (max-width: 650px) {
      .addition-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .add-card {
      background: #ff7675;
      border: 4px solid #d63031;
      border-radius: 20px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      transition: transform 0.15s;
    }

    .add-card:active { transform: scale(0.95); }

    .add-card-inner {
      background: #006266;
      border-radius: 14px;
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
    }

    .add-card-label {
      color: white;
      font-weight: bold;
      font-size: 13px;
      margin-top: 6px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    /* QUIZ & COUNTING BOARD (CHALKBOARD STYLE) */
    .quiz-page {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #273c75;
    }

    .quiz-header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .score-display {
      font-size: 18px;
      font-weight: bold;
      color: #2d3436;
      background: #feca57;
      padding: 8px 18px;
      border-radius: 20px;
    }

    /* CHALKBOARD SCREEN LIKE IN THE VIDEO */
    .chalkboard-card {
      position: relative;
      width: 100%;
      max-width: 500px;
      background: #1e3799;
      border: 10px solid #8c7ae6;
      border-radius: 24px;
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
      margin-bottom: 25px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .count-items-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      font-size: 50px;
    }

    .equation-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-size: 40px;
      color: white;
      font-weight: bold;
    }

    .target-box {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px dashed white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #feca57;
    }

    .options-grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .option-btn {
      width: 70px;
      height: 70px;
      font-size: 36px;
      font-weight: bold;
      border: none;
      border-radius: 18px;
      background: #ff4757;
      color: white;
      box-shadow: 0 6px 0 #c0392b, 0 10px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .option-btn:nth-child(2) { background: #2ed573; box-shadow: 0 6px 0 #26af5f; }
    .option-btn:nth-child(3) { background: #1e90ff; box-shadow: 0 6px 0 #0f68c9; }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #888;
    }

    /* POPUP BANNER LIKE IN VIDEO ("2 Giraffes") */
    .popup-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(to right, #4834d4, #686de0);
      border: 4px solid #ffffff;
      border-radius: 30px;
      padding: 15px 35px;
      color: white;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .popup-banner.show {
      transform: translate(-50%, -50%) scale(1);
    }

    .home-button {
      padding: 8px 16px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      font-weight: bold;
    }

    /* COLORING PAGE */
    .coloring-page {
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff0f6;
    }

    .shape-selector { display: flex; gap: 10px; margin-bottom: 15px; }

    .shape-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .canvas-card {
      background: white;
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
    }

    #colorCanvas {
      background: #ffffff;
      border-radius: 16px;
      cursor: crosshair;
      touch-action: none;
      border: 2px dashed #ddd;
    }

    .tools-bar {
      display: flex;
      gap: 12px;
      margin: 12px 0 5px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .brush-btn, .eraser-btn {
      border: 2px solid #ddd;
      background: #f8f9fa;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brush-btn.active, .eraser-btn.active {
      border-color: #ff4757;
      background: #ffeae8;
    }

    .brush-dot { background: #2d3436; border-radius: 50%; }

    .palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }

    .color-swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      margin: 0 auto;
    }

    .color-swatch.active { transform: scale(1.2); border-color: #2d3436; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="homePage" class="home-page">
    <div class="hero-content">
      <div class="brand-badge">🎮 FUN LEARNING</div>
      <h1 class="game-title">Kids <span>Maths</span></h1>
      <p class="game-subtitle">Learn Maths & Have Fun! 🎉</p>

      <button class="play-button" onclick="playGame()">
        <span class="play-icon">▶</span>
        <span>PLAY NOW</span>
      </button>
    </div>
  </div>

  <div id="menuPage" class="menu-page hidden">
    <button class="home-button" onclick="goHome()">🏠 Home</button>
    <h1 class="menu-title">🧮 Choose Mode</h1>

    <div class="menu-grid">
      <button class="card-btn" onclick="openAdditionSubMenu()">
        <span class="icon">➕</span>
        <span>Addition</span>
      </button>

      <button class="card-btn" onclick="startQuiz('count')">
        <span class="icon">🦒</span>
        <span>Counting</span>
      </button>

      <button class="card-btn" onclick="openColoring()">
        <span class="icon">🎨</span>
        <span>Coloring Pad</span>
      </button>
    </div>
  </div>

  <div id="additionSubMenu" class="addition-menu-page hidden">
    <div style="width: 100%; max-width: 720px; display: flex; justify-content: start;">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
    </div>

    <div class="banner-title">Addition</div>

    <div class="addition-grid">
      <div class="add-card" onclick="startQuiz('count')">
        <div class="add-card-inner">🦒🦒 ➔ [ 2 ]</div>
        <div class="add-card-label">Counting</div>
      </div>
      <div class="add-card" onclick="startQuiz('+')">
        <div class="add-card-inner">2 + 2 = 4</div>
        <div class="add-card-label">Adding Fun</div>
      </div>
    </div>
  </div>

  <div id="quizPage" class="quiz-page hidden">
    <div class="quiz-header">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
      <div id="scoreDisplay" class="score-display">⭐ Score: 0</div>
    </div>

    <div class="chalkboard-card">
      <div id="countItemsContainer" class="count-items-container">🦒 🦒</div>
      <div class="equation-row">
        <span>=</span>
        <div id="targetBox" class="target-box">?</div>
      </div>
    </div>

    <div id="optionsContainer" class="options-grid"></div>
  </div>

  <div id="popupBanner" class="popup-banner">
    <span id="popupText">2 Giraffes</span> 🎉
  </div>

  <div id="coloringPage" class="coloring-page hidden">
    <div class="quiz-header">
      <button class="home-button" onclick="goMenu()">⬅️ Menu</button>
      <div style="font-weight: bold; font-size: 20px;">🎨 Coloring Fun</div>
    </div>

    <div class="shape-selector">
      <button class="shape-btn" onclick="drawOutline('apple')">🍎 Apple</button>
      <button class="shape-btn" onclick="drawOutline('star')">⭐ Star</button>
      <button class="shape-btn" onclick="drawOutline('car')">🚗 Car</button>
    </div>

    <div class="canvas-card">
      <canvas id="colorCanvas" width="300" height="300"></canvas>
      
      <div class="tools-bar">
        <button class="brush-btn tool-item active" style="width: 38px; height: 38px;" onclick="selectBrush(22, this)">
          <div class="brush-dot" style="width: 14px; height: 14px;"></div>
        </button>
        <button class="eraser-btn tool-item" style="width: 42px; height: 42px;" onclick="selectEraser(this)">🧹</button>
      </div>

      <div class="palette">
        <div class="color-swatch active" style="background: #ff4757;" onclick="selectColor('#ff4757', this)"></div>
        <div class="color-swatch" style="background: #ffa502;" onclick="selectColor('#ffa502', this)"></div>
        <div class="color-swatch" style="background: #2ed573;" onclick="selectColor('#2ed573', this)"></div>
        <div class="color-swatch" style="background: #1e90ff;" onclick="selectColor('#1e90ff', this)"></div>
      </div>
    </div>
  </div>

  <script>
    let currentOp = 'count';
    let currentAnswer = 2;
    let currentItemName = 'Giraffes';
    let score = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAudioTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrectSound() {
      playAudioTone(523.25, 'triangle', 0.15);
      setTimeout(() => playAudioTone(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playAudioTone(783.99, 'triangle', 0.25), 200);
    }

    function playGame() {
      document.getElementById("homePage").classList.add("hidden");
      document.getElementById("menuPage").classList.remove("hidden");
    }

    function goHome() {
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("additionSubMenu").classList.add("hidden");
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("coloringPage").classList.add("hidden");
      document.getElementById("homePage").classList.remove("hidden");
    }

    function goMenu() {
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("additionSubMenu").classList.add("hidden");
      document.getElementById("coloringPage").classList.add("hidden");
      document.getElementById("menuPage").classList.remove("hidden");
    }

    function openAdditionSubMenu() {
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("additionSubMenu").classList.remove("hidden");
    }

    function startQuiz(op) {
      currentOp = op;
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("additionSubMenu").classList.add("hidden");
      document.getElementById("quizPage").classList.remove("hidden");
      generateQuestion();
    }

    function generateQuestion() {
      document.getElementById("targetBox").innerText = "?";
      let count = Math.floor(Math.random() * 4) + 1;
      currentAnswer = count;

      const items = [
        { icon: '🦒', name: 'Giraffes' },
        { icon: '🧁', name: 'Cupcakes' },
        { icon: '🍎', name: 'Apples' },
        { icon: '🍬', name: 'Candies' }
      ];

      let selectedItem = items[Math.floor(Math.random() * items.length)];
      currentItemName = selectedItem.name;

      let displayHTML = '';
      for (let i = 0; i < count; i++) {
        displayHTML += selectedItem.icon + ' ';
      }
      document.getElementById("countItemsContainer").innerHTML = displayHTML;

      let options = [count];
      while (options.length < 3) {
        let wrong = Math.floor(Math.random() * 5) + 1;
        if (!options.includes(wrong)) options.push(wrong);
      }
      options.sort(() => Math.random() - 0.5);

      let container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      options.forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, buttonEl) {
      if (selected == currentAnswer) {
        playCorrectSound();
        score += 10;
        document.getElementById("scoreDisplay").innerText = "⭐ Score: " + score;
        document.getElementById("targetBox").innerText = currentAnswer;

        // Show Video Like Success Banner
        let banner = document.getElementById("popupBanner");
        document.getElementById("popupText").innerText = `${currentAnswer} ${currentItemName}`;
        banner.classList.add("show");

        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });

        setTimeout(() => {
          banner.classList.remove("show");
          generateQuestion();
        }, 1500);
      } else {
        buttonEl.style.transform = "shake";
      }
    }

    /* COLORING CANVAS */
    let canvas, ctx;
    let currentColor = '#ff4757';
    let currentBrushSize = 22;
    let isEraser = false, isDrawing = false;
    let currentShape = 'apple';

    function openColoring() {
      document.getElementById("menuPage").classList.add("hidden");
      document.getElementById("coloringPage").classList.remove("hidden");
      canvas = document.getElementById("colorCanvas");
      ctx = canvas.getContext("2d");
      canvas.addEventListener("mousedown", startDrawing);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stopDrawing);
      canvas.addEventListener("touchstart", startDrawing);
      canvas.addEventListener("touchmove", draw);
      canvas.addEventListener("touchend", stopDrawing);
      drawOutline('apple');
    }

    function selectColor(color, el) { isEraser = false; currentColor = color; }
    function selectBrush(size, el) { isEraser = false; currentBrushSize = size; }
    function selectEraser(el) { isEraser = true; }
    function startDrawing(e) { isDrawing = true; draw(e); }
    function stopDrawing() { isDrawing = false; ctx.beginPath(); }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      let rect = canvas.getBoundingClientRect();
      let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      ctx.save();
      ctx.beginPath();
      ctx.arc(150, 150, 80, 0, Math.PI * 2);
      ctx.clip();

      if (isEraser) {
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = currentBrushSize * 1.5;
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.lineWidth = currentBrushSize;
        ctx.strokeStyle = currentColor;
      }

      ctx.lineCap = "round";
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.restore();
      redrawOutlineBorders();
    }

    function drawOutline(shape) {
      currentShape = shape;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      redrawOutlineBorders();
    }

    function redrawOutlineBorders() {
      ctx.save();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#2d3436";
      ctx.beginPath();
      ctx.arc(150, 150, 80, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  </script>
</body>
</html>
