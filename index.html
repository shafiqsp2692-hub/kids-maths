<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kids Maths</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HOME / START PAGE -->
  <div id="homePage" class="home-page">

    <div class="logo">
      🧮
    </div>

    <h1>Kids Maths</h1>

    <p>Learn Maths & Have Fun! 🎉</p>

    <button class="play-button" onclick="playGame()">
      ▶ PLAY
    </button>

  </div>


  <!-- MAIN MENU -->
  <div id="menuPage" class="menu-page hidden">

    <h1>🧮 Kids Maths</h1>

    <p>Choose a Maths Game</p>

    <button onclick="startQuiz('+')">
      ➕ Addition
    </button>

    <button onclick="startQuiz('-')">
      ➖ Subtraction
    </button>

    <button onclick="startQuiz('*')">
      ✖️ Multiplication
    </button>

    <button onclick="startQuiz('/')">
      ➗ Division
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
